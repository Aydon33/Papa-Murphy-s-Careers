<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papa Murphy's Utah Careers</title>
  <meta name="description" content="Join the Papa Murphy's Utah team. Share your interest in working at Utah Papa Murphy's locations.">
  <meta name="robots" content="noindex, nofollow">
  <!--
    BRAND / LOGO: This page uses a text wordmark only.
    Official Papa Murphy's logo files should not be added until
    brand use is cleared with corporate.
  -->
  <!--
    Fonts: papamurphys.com uses Adobe Typekit "brother-1816".
    We use freely available Google Fonts (Barlow / Barlow Condensed)
    as a similar condensed sans, with Arial and Helvetica as fallbacks.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <!-- Text wordmark. Replace with official artwork only after brand approval. -->
      <a class="wordmark" href="#top" id="wordmark"></a>
      <nav class="nav" aria-label="Page">
        <a href="#locations" id="nav-locations"></a>
        <a class="nav-apply" href="#apply" id="nav-apply"></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="wrap hero-inner">
        <h1 id="hero-title"></h1>
        <p class="hero-intro" id="hero-intro"></p>
        <a class="btn btn-primary" href="#apply" id="hero-button"></a>
      </div>
    </section>

    <section class="why" id="why" aria-labelledby="why-title">
      <div class="wrap">
        <h2 id="why-title"></h2>
        <p class="section-intro" id="why-intro"></p>
        <div class="why-grid" id="why-points"></div>
      </div>
    </section>

    <section class="locations" id="locations" aria-labelledby="locations-title">
      <div class="wrap">
        <h2 id="locations-title"></h2>
        <p class="section-intro" id="locations-intro"></p>
        <p class="locations-count" id="locations-count"></p>
        <div class="search">
          <label for="location-search" id="location-search-label"></label>
          <input type="search" id="location-search" autocomplete="off" spellcheck="false">
        </div>
        <div id="locations-list"></div>
        <p class="locations-empty" id="locations-empty" hidden></p>
      </div>
    </section>

    <section class="apply" id="apply" aria-labelledby="form-title">
      <div class="wrap">
        <div class="apply-inner">
        <h2 id="form-title"></h2>
        <p class="section-intro" id="form-intro"></p>
        <p class="form-required-note" id="form-required-note"></p>

        <!-- Shown when the Web3Forms key in content.js is still the placeholder. -->
        <div class="notice notice-warn" id="form-not-connected" hidden role="status"></div>

        <form id="interest-form" novalidate>
          <!-- Honeypot: leave empty. Web3Forms ignores submissions when this is filled. -->
          <div class="hp" aria-hidden="true">
            <label for="botcheck">Leave this field empty</label>
            <input type="checkbox" name="botcheck" id="botcheck" tabindex="-1" autocomplete="off">
          </div>

          <div class="form-row">
            <div class="field">
              <label for="first-name"><span id="label-first"></span> <span class="req" aria-hidden="true">*</span></label>
              <input id="first-name" name="first_name" type="text" required autocomplete="given-name" maxlength="80">
            </div>
            <div class="field">
              <label for="last-name"><span id="label-last"></span> <span class="req" aria-hidden="true">*</span></label>
              <input id="last-name" name="last_name" type="text" required autocomplete="family-name" maxlength="80">
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="phone"><span id="label-phone"></span> <span class="req" aria-hidden="true">*</span></label>
              <input id="phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel"
                     placeholder="801-555-1234"
                     pattern="^\s*(?:\+1[\s.\-]?)?(?:\(?\d{3}\)?[\s.\-]?)\d{3}[\s.\-]?\d{4}\s*$"
                     aria-describedby="phone-error">
              <p class="field-error" id="phone-error" hidden></p>
            </div>
            <div class="field">
              <label for="email"><span id="label-email"></span> <span class="req" aria-hidden="true">*</span></label>
              <input id="email" name="email" type="email" required autocomplete="email" maxlength="120"
                     aria-describedby="email-error">
              <p class="field-error" id="email-error" hidden></p>
            </div>
          </div>

          <div class="field">
            <label for="extra" id="label-extra"></label>
            <p class="field-hint" id="extra-hint"></p>
            <textarea id="extra" name="message" rows="5" maxlength="2000"></textarea>
          </div>

          <p class="form-status" id="form-status" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary" id="form-submit"></button>
          <p class="privacy" id="form-privacy"></p>
        </form>

        <!-- Shown after a successful submission. Nothing is saved in the browser. -->
        <div class="thank-you" id="thank-you" hidden>
          <h2 id="thank-you-title"></h2>
          <p id="thank-you-body"></p>
        </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-independent"></p>
      <p id="footer-contact"></p>
      <p class="footer-draft" id="footer-draft"></p>
    </div>
  </footer>

  <noscript>
    <p class="noscript">This page needs JavaScript to show locations and send the interest form.</p>
  </noscript>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
